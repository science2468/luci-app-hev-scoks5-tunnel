name: build luci-app-hev-socks-tunnel for immortalwrt
on: 
  workflow_dispatch:
jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Projects
      uses: actions/checkout@v2
      
    - name: Installation depends
      run: |
        sudo -E apt update -y
        sudo -E apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget
        
    - name: Clone source code
      run: |
        wget https://immortalwrt.kyarucloud.moe/releases/24.10.4/targets/mediatek/filogic/immortalwrt-sdk-24.10.4-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        tar -I zstd -xvf immortalwrt-sdk-*.zst && rm -r immortalwrt-sdk-*.zst

    - name: add custom package
      run: |
        cd immortalwrt-sdk*/package
        git clone --depth=1 git://github.com/science2468/luci-app-hev-socks5-tunnel.git
        ls
    - name: update feed
      run: |
        cd immortalwrt-sdk*
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: download
      run: |
        cd immortalwrt-sdk*
        make download -j$(nproc)
        
    - name: build
      run: |
        cd immortalwrt-sdk*
        make -j$(nproc) package/luci-app-qbittorrent/luci-app-hev-socks5-tunnel/compile V=99
        
    - name: Upload openwrt firmware
      uses: actions/upload-artifact@master
      with:
        name: immortalwrt-sdk
        path: immortalwrt-sdk*/bin/